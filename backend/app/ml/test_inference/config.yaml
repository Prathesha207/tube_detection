# config.yaml - settings for head_tail_analyzer (hta-frames)
# Relative paths are relative to THIS file's folder, so you can copy this
# folder (config + model + roi.json) to another machine as-is.
# Any setting can be overridden on the command line, e.g. --video, --output.

model_path: tube_pt/best_21-10-2026_named.pt
video: C:\Users\EmageVision\Videos\tube_video\session_2026-10-09_16-49-44.mp4     # set here or pass --video (a file, or 0 for webcam)
device: "0"          # "0" = first GPU, "cpu" = CPU

# detection
conf: 0.25
conf_head: 0.4
conf_tail: 0.2
max_heads: 0                   # e.g. 2 if the scene always has 2 heads (0 = no limit)
max_tails: 0
iou: 0.5
scale: 1.0                     # shrink frames first; try 0.33-0.5 if the ends look much bigger than in training
tile: 1280                     # the model was trained at imgsz 1280
tile_overlap: 0.3
merge_iou: 0.5       # merge duplicate boxes from overlapping tiles
merge_contain: 0.75
merge_gap: 0        # px - same-role boxes this close = one end split in two -> joined (0 = off)
cross_role_contain: 0.5   # tail box sitting on a head (or vice versa) -> keep the more confident (0 = off)
gray: true           # model was trained on grayscale images
stride: 1            # 1 = every frame

# tracking
min_frames: 5        # sightings before an end is confirmed and counted
min_frames_tail: null # same, for tails only (null = min_frames). Weak tails: try 2-3
max_dist: 80        # px an end may move between frames and stay the same end
max_dist_tail: null  # same, for tails only (null = max_dist)
max_missed: 30      # frames a lost track can still be re-matched

# drawing (output video / preview)
draw_scale: null     # size of lines + text; null = auto from frame size
box_fill: 0.2        # translucent fill inside each confirmed box (0 = off)
draw_masks: true     # outline the segmentation mask of each end
draw_unconfirmed: true # thin grey boxes for ends not yet confirmed
draw_legend: false

# width / bigger tube
width_method: auto             # auto = tube walls if the model has a tubing class, else head/tail mask thickness
width_from: tail               # tail = bigger tube decided by tails (fair); all = heads too (only with a tubing class)
min_ratio: 1.15                # 15 % wider needed to call one BIGGER
mm_per_px: null                # e.g. 0.08 for widths in mm (calibrate with a ruler); null = pixels
attach_gap: 3
max_disagree: 0.2

# ROI - inference + tracking use the whole frame; only detections inside
# this polygon are reported, drawn and counted. Set roi_json: null for none.
roi_json: null
draw_roi: false

# outputs (null = don't write)
output_video: measured/frames.mp4
latest_json: measured/latest_frame.json
history_jsonl: measured//history.jsonl                   # e.g. measured/history.jsonl
print_frames: true
show_preview: false