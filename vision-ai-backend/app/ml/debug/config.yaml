# ------------------ duck_analyzer config ------------------
# All thresholds and paths live here. Edit these, not the code.

# paths
model_path: "best.pt"
# hand / pose model (skips a frame when a hand is present)
# hand detection
hand_backend: mediapipe     # default; use "yolo" to fall back to a pose model
hand_conf: 0.6              # MediaPipe min_detection_confidence
hand_track_conf: 0.5
hand_hold_frames: 2 
# hand ROI: draw ONCE with draw_roi.py; hand short-circuit fires only
# when a hand overlaps this box. Delete the file to revert to whole-frame.
roi_path: "hand_roi.json"
# --- local saving (for YOUR reference/debugging) ---
save_local: false
thumbnail_dir: null
annotated_dir: null

# expected scene (expected_duck_count supplied by frontend per request)
expected_duck_count: null
duck_class_id: 0
other_class_id: 1

# detection
conf: 0.5

device: 0
use_half: false      # Set false for GTX 1060 (Pascal lacks Tensor Cores; FP32 is ~20% faster)
gpu_benchmark: false
debug: true
# deep appearance embedding for re-ID (fixes similar-colour duck id swaps).
# needs:  pip install transformers torchvision  (torch already installed)
# off by default; set true to enable. backend: auto|siglip|resnet.
use_embedder: false
embedder_backend: resnet
embed_weight: 0.5
swap_verify_min_app: 0.0  
# anchor
warmup_frames: 20
warmup_require_exact: false   # FIX (Issue 1): do not hang 300 frames on a count mismatch
warmup_max_frames: 20    # FIX (Issue 1): lock quickly even on short anomaly clips

# matching / ID stability
match_threshold: 0.20
pos_weight: 0.6
app_weight: 0.4
new_id_patience: 20
other_id_patience: 8
provisional_match_dist: 0.10
row_tolerance_frac: 0.06

# shake stabilization
anomaly_smoothing_frames: 15

# tracking (for MOVING ducks)
tracker: "bytetrack.yaml"
# frames a duck must be gone before a missing_alert thumbnail fires (once per episode)
missing_patience: 20
strict_count: true
rebind_pos_weight: 0.5
rebind_app_weight: 0.5
rebind_threshold: 0.2     # lower = easier to reclaim a slot (fewer false MISSING)
# a rebind must ALSO clear this appearance similarity, so a wrong-colour duck
# drifting over a missing duck's spot can't silently reclaim the slot (which
# masked the loss and forced a false NORMAL). Raise toward 0.5 if a different
# duck still steals a slot; lower toward 0.25 if genuine returns are rejected.
rebind_min_app: 0.35
# when two ducks are within crowd_dist_frac*diagonal of each other,
# position can't tell them apart, so lean on colour: use this heavier
# appearance weight for the crowded match (fixes id drift when close).
rebind_app_weight_crowded: 0.5
crowd_dist_frac: 0.06

# output
jpeg_quality: 80