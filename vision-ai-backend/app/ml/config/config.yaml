# ------------------ duck_analyzer config (1.0.13) ------------------
# All thresholds live here. Edit these, NOT the service code.
#
# PATHS: Do NOT put hardcoded absolute paths here.
#   - model_path is resolved by the inference services at runtime
#     (they always check app/ml/model/best.pt first, falling back to
#     whatever is written here only if that file actually exists).
#   - roi_path is resolved relative to THIS config file's directory.
#   - save_local is false (production). No frames are written to disk
#     by DuckAnalyzer; the inference services handle output themselves.

# ---- model ----
model_path: "model/best.pt"   # relative to app/ml/ — resolved at runtime

# ---- hand detection ----
hand_backend: mediapipe        # mediapipe (default) or yolo
hand_conf: 0.6                 # MediaPipe min_detection_confidence
hand_track_conf: 0.5
hand_hold_frames: 2
# ROI: resolved relative to the config file's directory.
# Delete the file to revert to whole-frame hand detection.
roi_path: "hand_roi.json"

# ---- local saving (production = OFF) ----
save_local: false
thumbnail_dir: null
annotated_dir: null

# ---- expected scene ----
expected_duck_count: null
duck_class_id: 0
other_class_id: 1

# ---- detection ----
conf: 0.5
iou: 0.7
imgsz: 640

# ---- GPU / precision ----
device: 0
use_half: true
gpu_benchmark: false

# ---- deep re-ID embedder ----
use_embedder: true
embedder_backend: resnet
embed_weight: 0.5
swap_verify_min_app: 0.5

# ---- diagnostics ----
debug: false

# ---- anchor / warmup ----
warmup_frames: 20
warmup_require_exact: false
warmup_max_frames: 20

# ---- matching / ID stability ----
match_threshold: 0.20
pos_weight: 0.6
app_weight: 0.4
new_id_patience: 20
other_id_patience: 8
provisional_match_dist: 0.10
row_tolerance_frac: 0.06

# ---- shake stabilization ----
anomaly_smoothing_frames: 15

# ---- tracking ----
tracker: "bytetrack.yaml"
missing_patience: 20
strict_count: true
rebind_pos_weight: 0.5
rebind_app_weight: 0.5
rebind_threshold: 0.2
rebind_min_app: 0.35
rebind_app_weight_crowded: 0.5
crowd_dist_frac: 0.06
reappear_patience: 5

# ---- output ----
jpeg_quality: 80