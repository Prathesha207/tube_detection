# config.yaml - settings for run_video_frames.py / head_tail_analyzer
# Relative paths are relative to THIS file's folder.
model_path: ../model/best.pt
video: null
device: "0"                    # "0" = first GPU, "cpu" = CPU

# detection
conf: 0.25
conf_head: 0.4
conf_tail: 0.2
max_heads: 0                   # e.g. 2 if the scene always has 2 heads (0 = no limit)
max_tails: 0
iou: 0.5
scale: 1.0                     # shrink frames first; try 0.33-0.5 if the ends look much bigger than in training
imgsz: 1280                    # model input size; None = tile (or 640 if tile is 0). Set 1280 for a 1280-trained model
tile: 0                     # the model was trained at imgsz 1280
tile_overlap: 0.3
merge_iou: 0.5
merge_contain: 0.75
merge_gap: 0
cross_role_contain: 0.5
gray: true
stride: 1

# tracking
min_frames: 5
max_dist: 80
max_missed: 30

# width / bigger tube
width_method: auto             # auto = tube walls if the model has a tubing class, else head/tail mask thickness
width_from: tail               # tail = bigger tube decided by tails (fair); all = heads too (only with a tubing class)
min_ratio: 1.15                # 15 % wider needed to call one BIGGER
mm_per_px: null                # e.g. 0.08 for widths in mm (calibrate with a ruler); null = pixels
attach_gap: 3
max_disagree: 0.2

# ROI - null = whole frame. Use --roi roi.json or --draw-roi
roi_json: roi.json
draw_roi: true

# outputs (null = don't write)
output_video: null
latest_json: null
history_jsonl: null
print_frames: true
show_preview: false
