# config.yaml - tube head/tail + wrapper trace with depth (XYZ)
model_path: ../model/best.pt
video: null
device: "0"

# 1. model input (unchanged)
gray: false
tile: 0
imgsz: 1280
scale: 1.0

# 2. confidence per class (unchanged; wrapper uses conf)
conf: 0.3
class_conf:
  head_white: 0.5
  head_blue: 0.5
  tail_white: 0.2
  tail_blue: 0.2
  white_tube: 0.3
  blue_tube: 0.3
  wrapper: 0.15
# 3. overlap removal inside the model (unchanged)
iou: 0.7

# 4. confirmation (instant single-frame detection for real-time live sync, no multi-frame lag)
min_frames: 1
min_frames_tail: null

# 5. duplicate cleanup for heads/tails (unchanged)
merge_iou: 0.3
merge_contain: 0.6
merge_gap: 0
cross_role_contain: 0
max_heads: 0
max_tails: 0

# 6. tubes (immediate display, zero hold to strictly prevent ghost masks)
tube_merge_any_class: true
track_tubes: true
tube_min_frames: 1
tube_hold: 0
tube_match_iou: 0.2
tube_match_grow: 15

# 7. whole frame, no ROI (unchanged)
roi_json: null

# 8. depth / 3D  (X right, Y down, Z forward, metres, origin = RGB camera)
depth_video: auto
camera_matrix:
  - [1070.789795, 0.0, 962.309387]
  - [0.0, 1070.526978, 550.0]
  - [0.0, 0.0, 1.0]
calib_width: 1920
calib_height: 1080
depth_scale: 0.001        # depth video in millimetres
depth_smooth: 15          # XYZ = median over the last 15 frames of the same end / trace

# 9. trace out of the wrapper: pixels ALONG the tube, from where it leaves the wrapper
trace_px: 100
trace_wrapper_gap: 4      # px: start this far outside the wrapper edge
trace_path_step_px: 0     # e.g. 25 -> also XYZ every 25 px along the trace ("path_xyz")

# 10. speed (none of these change what the model sees)
half: true                # FP16 on the GPU. Set false once and compare counts if in doubt
prefetch: true            # decode the next RGB + depth frame while the GPU works
print_frames: false       # per-frame printing to the console is slow on Windows (JSON still written)
profile: false            # true = print ms per stage every 30 frames
