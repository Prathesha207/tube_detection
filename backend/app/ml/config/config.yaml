# config.yaml - settings for run_video_frames.py
# Relative paths are relative to THIS file's folder. Absolute paths are used as-is.
# Any setting can be overridden on the command line, e.g. --video, --conf, --mm-per-px.

model_path: ../model/best.pt
video: null
device: "0"                    # "0" = first GPU, "cpu" = CPU

# detection
conf: 0.15
conf_head: 0.4
conf_tail: 0.3
max_heads: 0                   # e.g. 2 if the scene always has 2 heads (0 = no limit)
max_tails: 0
iou: 0.5
scale: 1.0                     # shrink frames first; try 0.33-0.5 if the ends look much bigger than in training
tile: 1280                     # the model was trained at imgsz 1280
tile_overlap: 0.3
merge_iou: 0.5
merge_contain: 0.75
merge_gap: 0
cross_role_contain: 0.5
gray: true
stride: 1

# tracking
min_frames: 5
min_frames_tail: null          # 0.1.6: separate threshold for tails (null = min_frames, weak tails: try 2-3)
max_dist: 80
max_dist_tail: null            # 0.1.6: separate max distance for tails (null = max_dist)
max_missed: 30

# drawing (0.1.6 HUD / video)
draw_scale: null               # size of lines + text; null = auto from frame size (1.0 at 1280 px)
box_fill: 0.2                  # translucent fill inside each confirmed box (0 = off, 0.4 = strong)
draw_masks: true               # outline the segmentation mask of each end
draw_unconfirmed: true         # thin grey boxes for ends not yet confirmed
draw_legend: false             # colour key off

# width / bigger tube
width_method: auto             # auto = tube walls if the model has a tubing class, else head/tail mask thickness
width_from: tail               # tail = bigger tube decided by tails (fair); all = heads too (only with a tubing class)
min_ratio: 1.15                # 15 % wider needed to call one BIGGER
mm_per_px: null                # e.g. 0.08 for widths in mm (calibrate with a ruler); null = pixels
attach_gap: 3
max_disagree: 0.2

# ROI - null = whole frame. Use --roi roi.json or --draw-roi
roi_json: null
draw_roi: false

# outputs (null = don't write) - each key only ONCE
output_video: null
latest_json: null
history_jsonl: null
print_frames: false
show_preview: false
